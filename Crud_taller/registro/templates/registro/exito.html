<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Éxito!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primario: #4f46e5;
            --exito: #16a34a;
            --exito-claro: #22c55e;
            --exito-suave: #f0fdf4;
            --texto: #1e293b;
            --texto-suave: #64748b;
            --borde: #e2e8f0;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--texto);
            background:
                radial-gradient(circle at 15% 20%, #bbf7d0 0, transparent 40%),
                radial-gradient(circle at 85% 80%, #c7d2fe 0, transparent 40%),
                #f8fafc;
        }

        .tarjeta {
            width: 100%;
            max-width: 440px;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 2.75rem 2rem 2.25rem;
            box-shadow: 0 20px 45px -15px rgba(22, 163, 74, 0.25),
                        0 8px 16px -8px rgba(15, 23, 42, 0.08);
            animation: entrada 0.5s ease both;
        }

        @keyframes entrada {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Icono de éxito con anillo pulsante */
        .icono {
            position: relative;
            width: 84px;
            height: 84px;
            margin: 0 auto 1.5rem;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--exito-claro), var(--exito));
            box-shadow: 0 12px 24px -6px rgba(22, 163, 74, 0.55);
            animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
        }

        .icono::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid var(--exito-claro);
            animation: pulso 2s ease-out 0.8s infinite;
        }

        .icono svg { width: 42px; height: 42px; }

        .icono path {
            stroke: #fff;
            stroke-dasharray: 30;
            stroke-dashoffset: 30;
            animation: trazo 0.5s ease 0.6s forwards;
        }

        @keyframes pop {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }
        @keyframes trazo { to { stroke-dashoffset: 0; } }
        @keyframes pulso {
            0%   { transform: scale(1);   opacity: 0.6; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--exito);
            margin-bottom: 0.6rem;
        }

        p {
            font-size: 0.97rem;
            line-height: 1.6;
            color: var(--texto-suave);
            margin-bottom: 2rem;
        }

        .acciones { display: flex; flex-direction: column; gap: 0.75rem; }

        .boton {
            display: inline-block;
            width: 100%;
            padding: 0.9rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primario), #7c3aed);
            box-shadow: 0 10px 20px -8px rgba(79, 70, 229, 0.6);
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
        }
        .boton:hover  { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 14px 24px -8px rgba(79, 70, 229, 0.7); }
        .boton:active { transform: translateY(0); }
        .boton:focus-visible { outline: 3px solid rgba(79, 70, 229, 0.4); outline-offset: 3px; }

        .boton-secundario {
            color: var(--texto-suave);
            background: transparent;
            border: 1.5px solid var(--borde);
            box-shadow: none;
        }
        .boton-secundario:hover {
            color: var(--primario);
            border-color: var(--primario);
            background: #eef2ff;
            box-shadow: none;
            filter: none;
        }

        @media (max-width: 480px) {
            .tarjeta { padding: 2.25rem 1.25rem 1.75rem; border-radius: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
            .icono path { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>

    <main class="tarjeta">
        <div class="icono" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 13l4 4L19 7"/>
            </svg>
        </div>

        <h1>¡Registro Guardado!</h1>
        <p>La asistencia se ha registrado correctamente en la base de datos.</p>

        <div class="acciones">
            <a href="/" class="boton">Volver al inicio</a>
            <!-- Opcional: ajusta la URL a la de tu formulario -->
            <a href="{% url 'registrar_asistencia' %}" class="boton boton-secundario">Registrar otra asistencia</a>
        </div>
    </main>

</body>
</html>
