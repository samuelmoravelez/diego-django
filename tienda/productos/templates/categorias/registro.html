<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }}</title>
    <style>
        :root {
            --color-primario: #080b08;
            --color-primario-oscuro: #0078b5;
            --color-fondo: #110ad9;
            --color-texto: #2d2d2d;
            --color-borde: #98003a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background-color: var(--color-fondo);
            color: var(--color-texto);
            line-height: 1.6;
        }

        .tarjeta {
            width: 100%;
            max-width: 520px;
            padding: 2rem;
            background: #fff;
            border-radius: 16px;
            border-top: 6px solid var(--color-borde);
            box-shadow: 0 10px 30px rgba(8, 11, 8, 0.35);
        }

        h1 {
            margin: 0 0 1.5rem;
            font-size: 1.7rem;
            color: var(--color-primario);
        }

        form p {
            margin: 0 0 1.1rem;
        }

        label {
            display: block;
            margin-bottom: 0.35rem;
            font-weight: 600;
            color: var(--color-primario);
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 2px solid #d5d5d5;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--color-texto);
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--color-primario-oscuro);
            box-shadow: 0 0 0 3px rgba(0, 120, 181, 0.25);
        }

        .helptext {
            display: block;
            margin-top: 0.25rem;
            font-size: 0.85rem;
            color: #6b6b6b;
        }

        .errorlist {
            margin: 0 0 0.4rem;
            padding: 0.4rem 0.75rem;
            list-style: none;
            border-left: 4px solid var(--color-borde);
            background-color: #fbeaf0;
            color: var(--color-borde);
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
        }

        button {
            margin-top: 0.5rem;
            padding: 0.7rem 1.8rem;
            border: none;
            border-radius: 999px;
            background-color: var(--color-primario-oscuro);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--color-primario);
            transform: translateY(-1px);
        }

        .volver {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--color-primario-oscuro);
            font-weight: 600;
            text-decoration: none;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .tarjeta {
                padding: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>{{ titulo }}</h1>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar</button>
        </form>

        <a class="volver" href="{% url 'categoria_list' %}">Regresar al listado de categorías</a>
    </div>
</body>
</html>
